# ============================================================================
#  Déploiement automatique maintenant sur VPS LWS (diambrapuzzle.com)
# ============================================================================
#
#  Configuration des Secrets GitHub (Settings → Secrets and variables → Actions) :
#
#    VPS_HOST       : Adresse IP ou domaine du VPS
#    VPS_USER       : root (ou utilisateur sudo)
#    VPS_SSH_KEY    : Clé privée (contenu COMPLET avec début/fin)
#    VPS_SSH_PORT   : 22 (optionnel)
#
#  ============================================================================
#  Générer et formater la clé SSH sur votre VPS :
#
#    ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
#    cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
#    cat ~/.ssh/id_rsa
#
#  Copier la sortie COMPLÈTE (y compris "-----BEGIN OPENSSH PRIVATE KEY-----")
# ============================================================================

name: 🚀 Déployer sur VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 📦 Déployer diambrapuzzle.com
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Vérification du code
        uses: actions/checkout@v4

      - name: 🔧 Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci --legacy-peer-deps
        # npm ci est plus fiable pour les CI/CD  et que npm install

      - name: 🧪 Vérification TypeScript et lint
        run: |
          npm run lint || echo "⚠️ Linting ignoré"
          if grep -q '"type-check"' package.json; then
            npm run type-check || echo "⚠️ Type-check ignoré"
          fi
        continue-on-error: true

      - name: 🔨 Build du projet
        id: build
        run: |
          echo "🔨 Build du projet..."
          export NEXT_PUBLIC_SITE_URL=https://diambrapuzzle.com
          export NEXT_TELEMETRY_DISABLED=1
          
          if ! npm run build; then
            echo "⚠️ Build échoué. Nettoyage du cache et nouvelle tentative..."
            rm -rf .next
            npm run build
          fi

      - name: 📊 Analyse du bundle (optionnel)
        run: |
          if grep -q '"analyze"' package.json; then
            npm run build -- --analyze
          else
            echo "📊 Analyse du bundle non configurée"
          fi
        continue-on-error: true

      - name: 🔧 Installation des prérequis sur le VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e
            
            echo "🔧 Vérification des prérequis..."
            
            # Mise à jour des outils système
            apt-get update -qq
            
            # Installation de Node.js 20 si nécessaire
            if ! command -v node &> /dev/null || [ "$(node -v | cut -d'v' -f2 | cut -d'.' -f1)" -lt 18 ]; then
              echo "📦 Installation de Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            
            # Installation de PM2 si nécessaire
            if ! command -v pm2 &> /dev/null; then
              echo "📦 Installation de PM2..."
              npm install -g pm2@latest
            fi
            
            # Installation de Git si nécessaire
            if ! command -v git &> /dev/null; then
              apt-get install -y git
            fi
            
            # Vérification des versions
            echo "✅ Node.js: $(node -v)"
            echo "✅ NPM: $(npm -v)"
            echo "✅ PM2: $(pm2 -v || echo 'Non installé')"

      - name: 🚀 Déploiement de l'application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -e
            
            # Configuration
            APP_DIR="/var/www/diambrapuzzle"
            PM2_NAME="diambrapuzzle"
            NEXT_PORT="3000"
            GIT_REPO="https://github.com/marcdiambralolo/diambrapuzzle.git"
            
            echo "========================================="
            echo "🚀 Déploiement: $PM2_NAME"
            echo "📂 Dossier: $APP_DIR"
            echo "🕐 $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="
            
            # Création du dossier s'il n'existe pas
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Vérification si c'est un repo Git
            if [ ! -d ".git" ]; then
              echo "📥 Clonage du repository..."
              git clone "$GIT_REPO" .
            fi
            
            # Sauvegarde du .env.production s'il existe
            if [ -f ".env.production" ]; then
              cp .env.production .env.production.backup
            fi
            
            # Git pull avec gestion des conflits
            echo "📥 Récupération du code depuis GitHub..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            git clean -fd
            
            # Restauration du .env.production
            if [ -f ".env.production.backup" ]; then
              mv .env.production.backup .env.production
            else
              # Création du fichier .env.production
              cat > .env.production << EOF
            NODE_ENV=production
            NEXT_PUBLIC_SITE_URL=https://diambrapuzzle.com
            PORT=$NEXT_PORT
            EOF
              echo "✅ Fichier .env.production créé"
            fi
            
            # Nettoyage du cache
            echo "🧹 Nettoyage du cache..."
            rm -rf node_modules .next
            npm cache clean --force
            
            # Installation des dépendances
            echo "📦 Installation des dépendances..."
            npm install --legacy-peer-deps
            
            # Build du projet
            echo "🔨 Build du projet..."
            if ! npm run build; then
              echo "⚠️ Build échoué, tentative avec plus de mémoire..."
              export NODE_OPTIONS="--max-old-space-size=4096"
              npm run build
            fi
            
            # Vérification du build
            if [ ! -d ".next" ]; then
              echo "❌ Build échoué - dossier .next absent"
              exit 1
            fi
            
            # Configuration du port
            export PORT=$NEXT_PORT
            
            # Gestion du processus PM2
            echo "🔄 Gestion du processus PM2..."
            if pm2 list | grep -q "$PM2_NAME"; then
              echo "🔄 Redémarrage de l'application..."
              pm2 restart "$PM2_NAME" --update-env
            else
              echo "🚀 Démarrage de l'application..."
              pm2 start npm --name "$PM2_NAME" -- start -- --port $NEXT_PORT
            fi
            
            # Sauvegarde de la configuration PM2
            pm2 save
            pm2 startup systemd || echo "⚠️ PM2 startup config ignorée"
            
            # Vérification que l'application tourne
            sleep 5
            if pm2 list | grep -q "$PM2_NAME.*online"; then
              echo "✅ Application démarrée avec succès"
            else
              echo "❌ L'application ne tourne pas correctement"
              pm2 logs "$PM2_NAME" --lines 20
              exit 1
            fi
            
            # Nettoyage des anciens logs
            echo "🧹 Nettoyage des logs..."
            pm2 flush
            
            echo "========================================="
            echo "✅ Déploiement terminé avec succès !"
            echo "🌐 https://diambrapuzzle.com"
            echo "📊 PM2 status:"
            pm2 status
            echo "========================================="

      - name: ✅ Vérification du déploiement
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 2m
          script: |
            echo "🔍 Vérification du déploiement..."
            sleep 10
            
            # Vérification PM2
            if pm2 list | grep -q "diambrapuzzle.*online"; then
              echo "✅ Application en ligne !"
              pm2 logs diambrapuzzle --lines 10 --nostream
              
              # Vérification du port
              if netstat -tlnp | grep -q ":3000.*LISTEN"; then
                echo "✅ Port 3000 actif"
              else
                echo "⚠️ Port 3000 non détecté"
              fi
            else
              echo "❌ L'application a un problème"
              pm2 logs diambrapuzzle --lines 30 --nostream
              exit 1
            fi
            
            # Test de l'API locale
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|304"; then
              echo "✅ Application répond sur localhost:3000"
            else
              echo "⚠️ Application ne répond pas sur localhost:3000"
            fi

      - name: 📢 Notification d'échec
        if: failure()
        run: |
          echo "❌ Le déploiement a échoué !"
          echo "📝 Vérifiez les logs ci-dessus pour plus de détails."
          echo ""
          echo "🔍 Causes possibles :"
          echo "  1. Secrets GitHub mal configurés (VPS_HOST, VPS_USER, VPS_SSH_KEY)"
          echo "  2. Problème de connexion SSH au VPS"
          echo "  3. Erreur de build (TypeScript, dépendances, etc.)"
          echo "  4. MongoDB non démarré sur le VPS"
          echo "  5. Port 3000 déjà utilisé"
          echo ""
          echo "📌 Correction du problème :"
          echo "  - Vérifiez les logs dans l'onglet 'Actions' de GitHub"
          echo "  - Connectez-vous au VPS: ssh root@\$VPS_HOST"
          echo "  - Vérifiez manuellement: cd /var/www/diambrapuzzle && npm run build"