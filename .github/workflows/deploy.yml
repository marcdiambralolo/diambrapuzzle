name: Deploy Diambra Puzzle to VPS

on:
  push:
    branches:
      - main # Exécute le pipeline à chaque push sur la branche main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}        # L'IP de votre VPS (ex: 117.220.x.x)
          username: ${{ secrets.VPS_USER }}    # Utilisateur (ex: root)
          key: ${{ secrets.VPS_SSH_KEY }}      # Clé privée SSH (ou pass si VPS_PASSWORD)
          port: 22
          script: |
            bash /var/www/diambrapuzzle/deploy.sh